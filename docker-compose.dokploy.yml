name: billionmail

services:
    pgsql-billionmail:
      image: postgres:17.4-alpine
      hostname: pgsql
      volumes:
        - postgresql-data:/var/lib/postgresql/data
        - shared-socket:/var/run/postgresql
      environment:
        - TZ=${TZ:-Etc/UTC}
        - POSTGRES_DB=${DBNAME:-billionmail}
        - POSTGRES_USER=${DBUSER:-billionmail}
        - POSTGRES_PASSWORD=${DBPASS}
      restart: always
      networks:
        - billionmail-network

    redis-billionmail:
      image: redis:7.4.2-alpine
      hostname: redis
      entrypoint: ["/bin/sh","/redis-conf.sh"]
      volumes:
        - redis-data:/data
        - ./conf/redis/redis-conf.sh:/redis-conf.sh
      restart: always
      environment:
        - TZ=${TZ:-Etc/UTC}
        - REDISPASS=${REDISPASS}
      sysctls:
        - net.core.somaxconn=4096
      networks:
        - billionmail-network

    rspamd-billionmail:
      image: billionmail/rspamd:1.2
      hostname: rspamd
      depends_on:
        - redis-billionmail
      environment:
        - TZ=${TZ:-Etc/UTC}
        - REDISPASS=${REDISPASS}
        - RETENTION_DAYS=${RETENTION_DAYS:-7}
      volumes:
        - ./conf/rspamd/local.d:/etc/rspamd/local.d
        - ./conf/rspamd/statistic.conf:/etc/rspamd/statistic.conf
        - ./conf/rspamd/rspamd.conf:/etc/rspamd/rspamd.conf
        - rspamd-data:/var/lib/rspamd
      restart: always
      networks:
        - billionmail-network

    dovecot-billionmail:
      image: billionmail/dovecot:1.5
      hostname: dovecot
      depends_on:
        - pgsql-billionmail
        - redis-billionmail
      cap_add:
        - NET_BIND_SERVICE
      volumes:
        - ./conf/dovecot/conf.d:/etc/dovecot/conf.d
        - ./conf/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf
        - ./conf/dovecot/rsyslog.conf:/etc/rsyslog.conf
        - ssl-certs:/etc/ssl/mail
        - ssl-self-signed:/etc/ssl/ssl-self-signed
        - vmail-data:/var/vmail
        - rspamd-data:/var/lib/rspamd
        - shared-socket:/var/run/postgresql
      environment:
        - DBNAME=${DBNAME:-billionmail}
        - DBUSER=${DBUSER:-billionmail}
        - DBPASS=${DBPASS}
        - TZ=${TZ:-Etc/UTC}
        - BILLIONMAIL_HOSTNAME=${BILLIONMAIL_HOSTNAME:-mail.example.com}
        - REDISPASS=${REDISPASS}
        - RETENTION_DAYS=${RETENTION_DAYS:-7}
      ports:
        - "${IMAP_PORT:-143}:143"
        - "${IMAPS_PORT:-993}:993"
        - "${POP_PORT:-110}:110"
        - "${POPS_PORT:-995}:995"
      restart: always
      ulimits:
        nproc: 65535
        nofile:
          soft: 20000
          hard: 40000
      networks:
        - billionmail-network

    postfix-billionmail:
      image: billionmail/postfix:1.6
      hostname: postfix
      depends_on:
        pgsql-billionmail:
          condition: service_started
      volumes:
        - ./conf/postfix/main.cf:/etc/postfix/main.cf
        - ./conf/postfix/master.cf:/etc/postfix/master.cf
        - ./conf/postfix/conf:/etc/postfix/conf
        - ./conf/postfix/sql:/etc/postfix/sql
        - ./conf/postfix/rsyslog.conf:/etc/rsyslog.conf
        - ssl-certs:/etc/ssl/mail
        - postfix-data:/var/spool/postfix
        - rspamd-data:/var/lib/rspamd
        - shared-socket:/var/run/postgresql
      environment:
        - TZ=${TZ:-Etc/UTC}
        - DBNAME=${DBNAME:-billionmail}
        - DBUSER=${DBUSER:-billionmail}
        - DBPASS=${DBPASS}
        - REDISPASS=${REDISPASS}
        - BILLIONMAIL_HOSTNAME=${BILLIONMAIL_HOSTNAME:-mail.example.com}
        - RETENTION_DAYS=${RETENTION_DAYS:-7}
      cap_add:
        - NET_BIND_SERVICE
      ports:
        - "${SMTP_PORT:-25}:25"
        - "${SMTPS_PORT:-465}:465"
        - "${SUBMISSION_PORT:-587}:587"
      restart: always
      networks:
        - billionmail-network

    webmail-billionmail:
      image: roundcube/roundcubemail:1.6.10-fpm-alpine
      hostname: roundcube
      depends_on:
        - pgsql-billionmail
        - dovecot-billionmail
        - postfix-billionmail
      volumes:
        - webmail-data:/var/www/html
        - ./conf/webmail:/var/roundcube/config
        - ./conf/php:/usr/local/etc
        - php-sock:/var/run/
      environment:
        - TZ=${TZ:-Etc/UTC}
        - ROUNDCUBEMAIL_DB_TYPE=pgsql
        - ROUNDCUBEMAIL_DB_HOST=pgsql
        - ROUNDCUBEMAIL_DB_NAME=${DBNAME:-billionmail}
        - ROUNDCUBEMAIL_DB_USER=${DBUSER:-billionmail}
        - ROUNDCUBEMAIL_DB_PASSWORD=${DBPASS}
        - ROUNDCUBEMAIL_DEFAULT_HOST=dovecot
        - ROUNDCUBEMAIL_DEFAULT_PORT=${IMAP_PORT:-143}
        - ROUNDCUBEMAIL_SMTP_SERVER=postfix
        - ROUNDCUBEMAIL_SMTP_PORT=${SMTP_PORT:-25}
        - ROUNDCUBEMAIL_REQUEST_PATH=/roundcube
      restart: always
      networks:
        - billionmail-network

    core-billionmail:
      image: billionmail/core:4.4.2
      hostname: core-manage
      depends_on:
        - pgsql-billionmail
      volumes:
        - ./.env:/opt/billionmail/.env
        - ssl-certs:/etc/ssl/mail
        - ssl-self-signed:/etc/ssl/ssl-self-signed
        - ./conf/core/fail2ban/filter.d:/etc/fail2ban/filter.d
        - ./conf/core/fail2ban/jail.d:/etc/fail2ban/jail.d
        - fail2ban-logs:/var/log/fail2ban
        - shared-socket:/opt/billionmail/postgresql-socket
        - php-sock:/opt/billionmail/php-sock
        - rspamd-data:/opt/billionmail/rspamd-data
        - webmail-data:/opt/billionmail/webmail-data
        - ./conf:/opt/billionmail/conf
        - ./logs:/opt/billionmail/logs
        - core-data:/opt/billionmail/core/data
        - /var/run/docker.sock:/var/run/docker.sock:ro
      environment:
        - TZ=${TZ:-Etc/UTC}
        - FAIL2BAN_INIT=${FAIL2BAN_INIT:-y}
        - ADMIN_USERNAME=${ADMIN_USERNAME:-billion}
        - ADMIN_PASSWORD=${ADMIN_PASSWORD:-billion}
        - SafePath=${SafePath:-billion}
        - BILLIONMAIL_HOSTNAME=${BILLIONMAIL_HOSTNAME:-mail.example.com}
        - DBNAME=${DBNAME:-billionmail}
        - DBUSER=${DBUSER:-billionmail}
        - DBPASS=${DBPASS}
        - REDISPASS=${REDISPASS}
        - IP_WHITELIST_ENABLE=${IP_WHITELIST_ENABLE:-false}
        - RETENTION_DAYS=${RETENTION_DAYS:-7}
        - HTTP_PORT=80
        - HTTPS_PORT=443
      cap_add:
        - NET_BIND_SERVICE
        - NET_ADMIN
        - NET_RAW
      ports:
        - "${CORE_HTTP_PORT:-8080}:80"
        - "${CORE_HTTPS_PORT:-8443}:443"
      restart: always
      networks:
        - billionmail-network

networks:
  billionmail-network:
    driver: bridge

volumes:
  postgresql-data:
  redis-data:
  rspamd-data:
  vmail-data:
  postfix-data:
  webmail-data:
  core-data:
  ssl-certs:
  ssl-self-signed:
  shared-socket:
  php-sock:
  fail2ban-logs: